<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - CBZ Reader</title>
    <meta name="description" content="This page does not exist. Open the CBZ reader to read a comic file locally." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>(function(){var d;try{var s=localStorage.getItem("cbz-theme");if(s==="light"||s==="dark")d=s}catch(e){}if(!d){d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}var r=document.documentElement;r.setAttribute("data-theme",d);r.style.colorScheme=d;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d==="dark"?"#0d0d12":"#f7f5f0")})()</script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5f0;
        --glow: #fff8ef;
        --ink: #17171a;
        --muted: #5c5c66;
        --line: #e3ded4;
        --accent: #c2410c;
        --accent-hover: #9a3412;
        --btn-bg: #c2410c;
        --btn-hover: #9a3412;
        --btn-ink: #ffffff;
        --dark: #0d0d12;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0d0d12;
        --glow: #1e1712;
        --ink: #f4f4f5;
        --muted: #a3a3ad;
        --line: #2b2b34;
        --accent: #fb923c;
        --accent-hover: #fdba74;
        --btn-bg: #f97316;
        --btn-hover: #fb923c;
        --btn-ink: #0d0d12;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.6;
        background:
          radial-gradient(1100px 520px at 50% -12%, var(--glow) 0%, transparent 62%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .brand__mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 40px 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 42px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 17px;
        max-width: 46ch;
      }
      .btn {
        display: inline-block;
        padding: 13px 24px;
        border-radius: 999px;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--btn-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .links {
        margin: 36px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted);
      }
      .links a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">CB</span>
        <span>CBZ Reader</span>
      </a>
      <p class="eyebrow">Error 404</p>
      <h1>That page is not here</h1>
      <p class="lead">
        The link may be outdated or mistyped. The reader lives on the home page, and your comic files
        are never uploaded, so nothing is lost by starting again from there.
      </p>
      <a class="btn" href="/">Open the CBZ reader</a>
      <nav class="links" aria-label="Site">
        <a href="/how-to-open-cbz/">How to open a CBZ file</a>
        <a href="/manga-reader/">Manga mode</a>
        <a href="/cbz-vs-cbr/">CBZ vs CBR</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </main>
  </body>
</html>
