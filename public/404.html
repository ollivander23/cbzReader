<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - CBZ Reader</title>
    <meta name="description" content="This page does not exist. Open the CBZ reader to read a comic file locally." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>(function(){var d;try{var s=localStorage.getItem("cbz-theme");if(s==="light"||s==="dark")d=s}catch(e){}if(!d){d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}var r=document.documentElement;r.setAttribute("data-theme",d);r.style.colorScheme=d;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d==="dark"?"#0d0d12":"#f7f5f0")})()</script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5f0;
        --glow: #fff8ef;
        --surface: #ffffff;
        --ink: #17171a;
        --ink-soft: #3a3a41;
        --muted: #5c5c66;
        --line: #e3ded4;
        --line-strong: #cfc7b8;
        --hover-fill: rgba(23, 23, 26, 0.06);
        --accent: #c2410c;
        --accent-hover: #9a3412;
        --btn-bg: #c2410c;
        --btn-hover: #9a3412;
        --btn-ink: #ffffff;
        --shadow: rgba(23, 23, 26, 0.45);
        --dark: #0d0d12;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0d0d12;
        --glow: #1e1712;
        --surface: #16161c;
        --ink: #f4f4f5;
        --ink-soft: #d4d4d8;
        --muted: #a3a3ad;
        --line: #2b2b34;
        --line-strong: #3a3a45;
        --hover-fill: rgba(255, 255, 255, 0.08);
        --accent: #fb923c;
        --accent-hover: #fdba74;
        --btn-bg: #f97316;
        --btn-hover: #fb923c;
        --btn-ink: #0d0d12;
        --shadow: rgba(0, 0, 0, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.6;
        background:
          radial-gradient(1100px 520px at 50% -12%, var(--glow) 0%, transparent 62%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .theme-switch {
        position: relative;
        flex: none;
      }
      .theme-switch__trigger {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      .theme-switch__icon {
        display: block;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .theme-switch__icon--moon {
        display: none;
      }
      :root[data-theme='dark'] .theme-switch__icon--sun {
        display: none;
      }
      :root[data-theme='dark'] .theme-switch__icon--moon {
        display: block;
      }
      .theme-switch__menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 10;
        display: grid;
        gap: 2px;
        min-width: 168px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 18px 40px -22px var(--shadow);
      }
      .theme-switch__menu[hidden] {
        display: none;
      }
      .theme-switch__item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink-soft);
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      .theme-switch__item:hover,
      .theme-switch__item[aria-checked='true'] {
        background: var(--hover-fill);
        color: var(--ink);
      }
      .theme-switch__item svg {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .theme-switch__check {
        margin-left: auto;
        color: var(--accent);
        font-size: 12px;
        visibility: hidden;
      }
      .theme-switch__item[aria-checked='true'] .theme-switch__check {
        visibility: visible;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .brand__mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--ink);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 40px 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 42px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 17px;
        max-width: 46ch;
      }
      .btn {
        display: inline-block;
        padding: 13px 24px;
        border-radius: 999px;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--btn-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .links {
        margin: 36px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted);
      }
      .links a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">CB</span>
          <span>CBZ Reader</span>
        </a>
        <div class="theme-switch">
          <button
            class="theme-switch__trigger"
            type="button"
            aria-label="Change color theme"
            aria-haspopup="menu"
            aria-controls="site-theme-menu"
            aria-expanded="false"
          >
            <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="3" />
              <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" />
            </svg>
            <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M12.5 9.6A5.5 5.5 0 0 1 6.4 3.5a5.5 5.5 0 1 0 6.1 6.1z" />
            </svg>
          </button>
          <div class="theme-switch__menu" id="site-theme-menu" role="menu" aria-label="Color theme" hidden>
            <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-theme-value="auto">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" /><path d="M8 2.5v11" /></svg>
              <span>Auto</span>
              <span class="theme-switch__check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-theme-value="light">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" /></svg>
              <span>Light</span>
              <span class="theme-switch__check" aria-hidden="true">✓</span>
            </button>
            <button type="button" class="theme-switch__item" role="menuitemradio" aria-checked="false" data-theme-value="dark">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 9.6A5.5 5.5 0 0 1 6.4 3.5a5.5 5.5 0 1 0 6.1 6.1z" /></svg>
              <span>Dark</span>
              <span class="theme-switch__check" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>
      </div>
      <p class="eyebrow">Error 404</p>
      <h1>That page is not here</h1>
      <p class="lead">
        The link may be outdated or mistyped. The reader lives on the home page, and your comic files
        are never uploaded, so nothing is lost by starting again from there.
      </p>
      <a class="btn" href="/">Open the CBZ reader</a>
      <nav class="links" aria-label="Site">
        <a href="/how-to-open-cbz/">How to open a CBZ file</a>
        <a href="/manga-reader/">Manga mode</a>
        <a href="/cbz-vs-cbr/">CBZ vs CBR</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </main>
    <script>
      ;(function () {
        var KEY = 'cbz-theme'
        var root = document.documentElement
        var wrap = document.querySelector('.theme-switch')
        var trigger = wrap.querySelector('.theme-switch__trigger')
        var menu = wrap.querySelector('.theme-switch__menu')
        var items = Array.prototype.slice.call(menu.querySelectorAll('[data-theme-value]'))

        function read() {
          try {
            var saved = localStorage.getItem(KEY)
            return saved === 'light' || saved === 'dark' ? saved : 'auto'
          } catch (error) {
            return 'auto'
          }
        }

        function apply(setting) {
          var resolved = setting
          if (setting === 'auto') {
            resolved =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          }
          root.setAttribute('data-theme', resolved)
          root.style.colorScheme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0d0d12' : '#f7f5f0')
          items.forEach(function (item) {
            item.setAttribute(
              'aria-checked',
              item.getAttribute('data-theme-value') === setting ? 'true' : 'false',
            )
          })
        }

        function setOpen(next) {
          menu.hidden = !next
          trigger.setAttribute('aria-expanded', next ? 'true' : 'false')
          if (next) {
            var current = read()
            var active = items.filter(function (item) {
              return item.getAttribute('data-theme-value') === current
            })[0]
            ;(active || items[0]).focus()
          }
        }

        items.forEach(function (item) {
          item.addEventListener('click', function () {
            var value = item.getAttribute('data-theme-value')
            try {
              localStorage.setItem(KEY, value)
            } catch (error) {}
            apply(value)
            setOpen(false)
            trigger.focus()
          })
        })

        trigger.addEventListener('click', function () {
          setOpen(menu.hidden)
        })

        document.addEventListener('pointerdown', function (event) {
          if (!menu.hidden && !wrap.contains(event.target)) setOpen(false)
        })

        document.addEventListener('keydown', function (event) {
          if (event.key !== 'Escape' || menu.hidden) return
          setOpen(false)
          trigger.focus()
        })

        apply(read())
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (read() === 'auto') apply('auto')
          })
        }
      })()
    </script>
  </body>
</html>
