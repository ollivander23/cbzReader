<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - CBZ Reader</title>
    <meta name="description" content="This page does not exist. Open the CBZ reader to read a comic file locally." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#e6ecef" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>(function(){var d;try{var s=localStorage.getItem("cbz-theme");if(s==="light"||s==="dark")d=s}catch(e){}if(!d){d=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}var r=document.documentElement;r.setAttribute("data-theme",d);r.style.colorScheme=d;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",d==="dark"?"#12161b":"#e6ecef")})()</script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest-dark.webmanifest" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --bg: #e6ecef;
        --surface: #f4f7f8;
        --ink: #101418;
        --muted: #5b6870;
        --line: #c3ccd2;
        --line-strong: #9fabb2;
        --rule: #101418;
        --hover-fill: rgba(16, 20, 24, 0.06);
        --card-bg-hover: #fbfdfd;
        --focus: #101418;
        --btn-bg: #101418;
        --btn-hover: #313a41;
        --btn-ink: #f4f7f8;
        --stamp-red: #b8362a;
        --press-shadow: rgba(0, 0, 0, 0.55);
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #12161b;
        --surface: #1a1f25;
        --ink: #eef2f4;
        --muted: #a7b2b9;
        --line: #3a444c;
        --line-strong: #57636c;
        --rule: #c9d3da;
        --hover-fill: rgba(255, 255, 255, 0.08);
        --card-bg-hover: #20262d;
        --focus: #eef2f4;
        --btn-bg: #eef2f4;
        --btn-hover: #d5dde2;
        --btn-ink: #12161b;
        --stamp-red: #d95f4a;
        --press-shadow: rgba(0, 0, 0, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.6;
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .theme-switch {
        position: relative;
        flex: none;
      }
      .theme-switch__trigger {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid var(--rule);
        border-radius: 0;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .theme-switch__trigger:hover {
        border-color: var(--line-strong);
        background: var(--card-bg-hover);
      }
      .theme-switch__icon {
        display: block;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .theme-switch__icon--moon {
        display: none;
      }
      :root[data-theme='dark'] .theme-switch__icon--sun {
        display: none;
      }
      :root[data-theme='dark'] .theme-switch__icon--moon {
        display: block;
      }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        text-decoration: none;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      .brand__mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 30px;
        border-radius: 0;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-size: 11.5px;
        font-weight: 800;
      }
      .eyebrow {
        display: inline-block;
        margin: 40px 0 10px;
        padding: 5px 9px;
        border: 2px solid var(--stamp-red);
        color: var(--stamp-red);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        line-height: 1;
        text-transform: uppercase;
        transform: rotate(-4deg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 42px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 17px;
        max-width: 46ch;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 0;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-weight: 650;
        text-decoration: none;
        box-shadow: 3px 3px 0 var(--press-shadow);
        transition: background 0.15s ease, transform 0.12s ease, box-shadow 0.12s ease;
      }
      .btn:hover {
        background: var(--btn-hover);
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 var(--press-shadow);
      }
      .btn:active {
        transform: translate(3px, 3px);
        box-shadow: none;
      }
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      .links {
        margin: 36px 0 0;
        padding-top: 20px;
        border-top: 2px solid var(--rule);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted);
      }
      .links a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">CBZ</span>
          <span>CBZ Reader</span>
        </a>
        <div class="theme-switch">
          <button
            class="theme-switch__trigger"
            type="button"
            aria-label="Switch to dark theme"
            aria-pressed="false"
            title="Switch to dark theme"
          >
            <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="3" />
              <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" />
            </svg>
            <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M12.5 9.6A5.5 5.5 0 0 1 6.4 3.5a5.5 5.5 0 1 0 6.1 6.1z" />
            </svg>
          </button>
        </div>
      </div>
      <p class="eyebrow">Error 404</p>
      <h1>That page is not here</h1>
      <p class="lead">
        The link may be outdated or mistyped. The reader lives on the home page, and your comic files
        are never uploaded, so nothing is lost by starting again from there.
      </p>
      <a class="btn" href="/">Open the CBZ reader</a>
      <nav class="links" aria-label="Site">
        <a href="/how-to-open-cbz/">How to open a CBZ file</a>
        <a href="/cbz-vs-cbr/">CBZ vs CBR</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </main>
    <script>
      ;(function () {
        var KEY = 'cbz-theme'
        var root = document.documentElement
        var trigger = document.querySelector('.theme-switch__trigger')

        function read() {
          try {
            var saved = localStorage.getItem(KEY)
            return saved === 'light' || saved === 'dark' ? saved : 'auto'
          } catch (error) {
            return 'auto'
          }
        }

        function systemTheme() {
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }

        function paint(resolved) {
          root.setAttribute('data-theme', resolved)
          root.style.colorScheme = resolved
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#12161b' : '#e6ecef')
          var label = resolved === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
          trigger.setAttribute('aria-pressed', resolved === 'dark' ? 'true' : 'false')
          trigger.setAttribute('aria-label', label)
          trigger.title = label
        }

        function resolve(setting) {
          return setting === 'auto' ? systemTheme() : setting
        }

        trigger.addEventListener('click', function () {
          // A stored 'auto' resolves to whatever is on screen, then flips it.
          var next = resolve(read()) === 'dark' ? 'light' : 'dark'
          try {
            localStorage.setItem(KEY, next)
          } catch (error) {}
          paint(next)
        })

        paint(resolve(read()))
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (read() === 'auto') paint(systemTheme())
          })
        }
      })()
    </script>
  </body>
</html>
