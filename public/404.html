<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found - CBZ Reader</title>
    <meta name="description" content="This page does not exist. Open the CBZ reader to read a comic file locally." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0d0d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f5f0;
        --ink: #17171a;
        --muted: #5c5c66;
        --line: #e3ded4;
        --accent: #c2410c;
        --accent-hover: #9a3412;
        --dark: #0d0d12;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        color: var(--ink);
        font-family: var(--font-sans);
        line-height: 1.6;
        background:
          radial-gradient(1100px 520px at 50% -12%, #fff8ef 0%, rgba(255, 248, 239, 0) 62%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        text-decoration: none;
        color: var(--dark);
        letter-spacing: -0.01em;
      }
      .brand__mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--dark);
        color: #f7f5f0;
        font-size: 13px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 40px 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 5vw, 42px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 17px;
        max-width: 46ch;
      }
      .btn {
        display: inline-block;
        padding: 13px 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .links {
        margin: 36px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted);
      }
      .links a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">CB</span>
        <span>CBZ Reader</span>
      </a>
      <p class="eyebrow">Error 404</p>
      <h1>That page is not here</h1>
      <p class="lead">
        The link may be outdated or mistyped. The reader lives on the home page, and your comic files
        are never uploaded, so nothing is lost by starting again from there.
      </p>
      <a class="btn" href="/">Open the CBZ reader</a>
      <nav class="links" aria-label="Site">
        <a href="/how-to-open-cbz/">How to open a CBZ file</a>
        <a href="/manga-reader/">Manga mode</a>
        <a href="/cbz-vs-cbr/">CBZ vs CBR</a>
        <a href="/privacy/">Privacy</a>
      </nav>
    </main>
  </body>
</html>
